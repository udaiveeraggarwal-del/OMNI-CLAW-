<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-CLAW Visual Workflow Builder</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: #c9d1d9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            margin: 0; 
            overflow: hidden;
        }
        .toolbar { 
            padding: 12px 24px; 
            background-color: #161b22; 
            border-bottom: 1px solid #30363d; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toolbar h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        button {
            background-color: #238636;
            color: #ffffff;
            border: 1px solid rgba(240,246,252,0.1);
            border-radius: 6px;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            cursor: pointer;
        }
        button:hover { background-color: #2ea043; }
        .canvas { width: 100vw; height: calc(100vh - 46px); position: relative; overflow: hidden; }
        
        .node { 
            position: absolute; 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            padding: 16px; 
            cursor: grab;
            width: 150px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            user-select: none;
            z-index: 10;
        }
        .node:active { cursor: grabbing; }
        .node-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #58a6ff;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        path {
            fill: none;
            stroke: #8b949e;
            stroke-width: 2;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 999;
        }
        .modal { 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background-color: #0d1117; 
            padding: 24px; 
            border: 1px solid #30363d; 
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 1000; 
            width: 300px;
        }
        .modal h3 { margin-top: 0; }
        .modal input {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            background-color: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            box-sizing: border-box;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-buttons button.cancel { background-color: #21262d; border-color: rgba(240,246,252,0.1); }
        .modal-buttons button.cancel:hover { background-color: #30363d; }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>OMNI-CLAW Workflow Builder</h1>
        <button onclick="document.getElementById('modal-overlay').style.display='block'">API Settings</button>
    </div>
    
    <div class="canvas" id="canvas">
        <svg id="wires">
            <path id="wire1" d="M 182 116 C 250 116, 250 216, 316 216" />
        </svg>
        <div class="node" id="node1" style="top: 100px; left: 100px;">
            <div class="node-title">Trigger</div>
            <div>Start event</div>
        </div>
        <div class="node" id="node2" style="top: 200px; left: 300px;">
            <div class="node-title">LLM Agent</div>
            <div>Process data</div>
        </div>
    </div>
    
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="api-modal">
            <h3>API Key Settings</h3>
            <input type="text" placeholder="Enter API Key" />
            <div class="modal-buttons">
                <button class="cancel" onclick="document.getElementById('modal-overlay').style.display='none'">Cancel</button>
                <button onclick="document.getElementById('modal-overlay').style.display='none'">Save</button>
            </div>
        </div>
    </div>

    <script>
        const nodes = [document.getElementById('node1'), document.getElementById('node2')];
        const wire = document.getElementById('wire1');
        let activeNode = null;
        let offsetX = 0, offsetY = 0;

        nodes.forEach(node => {
            node.addEventListener('mousedown', (e) => {
                activeNode = node;
                offsetX = e.clientX - node.offsetLeft;
                offsetY = e.clientY - node.offsetTop;
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (activeNode) {
                activeNode.style.left = (e.clientX - offsetX) + 'px';
                activeNode.style.top = (e.clientY - offsetY) + 'px';
                updateWire();
            }
        });

        document.addEventListener('mouseup', () => {
            activeNode = null;
        });

        function updateWire() {
            const n1 = nodes[0];
            const n2 = nodes[1];
            const x1 = n1.offsetLeft + n1.offsetWidth;
            const y1 = n1.offsetTop + n1.offsetHeight / 2;
            const x2 = n2.offsetLeft;
            const y2 = n2.offsetTop + n2.offsetHeight / 2;
            
            const dx = Math.max(Math.abs(x2 - x1) / 2, 50);
            wire.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
        }
        
        // Initial setup
        updateWire();
    </script>
</body>
</html>
