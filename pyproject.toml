[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagent-framework"
version = "1.0.0"
description = "Provider-neutral agent runtime with extensible skills and bounded execution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20,<5",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.48,<2",
]

[tool.setuptools.packages.find]
include = ["omniagent*"]
